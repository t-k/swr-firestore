name: Publish to npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: "temurin"
          java-version: "21"
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm add -g firebase-tools
      - run: pnpm run test:ci
      - run: pnpm run package:check
      - name: Verify tag matches package version
        run: node -e 'const v=require("./package.json").version; if ("v" + v !== process.env.GITHUB_REF_NAME) { console.error("Tag " + process.env.GITHUB_REF_NAME + " does not match package version v" + v); process.exit(1); }'
      - name: Publish to npm
        run: pnpm publish --provenance --access public --no-git-checks
