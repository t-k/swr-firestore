name: Publish to npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Java 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: "temurin"
          java-version: "21"
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm add -g firebase-tools
      - run: pnpm run test:ci
      - run: pnpm run package:check
      - name: Verify tag matches package version
        run: node -e 'const v=require("./package.json").version; if ("v" + v !== process.env.GITHUB_REF_NAME) { console.error("Tag " + process.env.GITHUB_REF_NAME + " does not match package version v" + v); process.exit(1); }'
      - name: Publish to npm
        run: pnpm publish --provenance --access public --no-git-checks
